[project]
name = "worldcup-forecasting"
version = "0.1.0"
description = "Leakage-safe, reproducible World Cup analysis and forecasting for APMCM 2026 Problem A"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "hydra-core>=1.3.2,<1.4",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<3.11",
  "numpy>=2.1,<3",
  "omegaconf>=2.3,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<1.7",
  "scipy>=1.14,<1.16",
  "seaborn>=0.13,<0.14",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
worldcup-forecast = "worldcup_forecasting.cli:main"
worldcup-verify = "worldcup_forecasting.verify:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcup_forecasting"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: uses the supplied full dataset",
  "slow: runs the complete pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
