[project]
name = "taolin-dc-sim"
version = "0.1.0"
description = "Reproducibility scripts and frozen artifacts for the TAILOR-DC-SAFE competition solution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyarrow>=12,<25",
    "pypdf>=5,<7",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "scipy>=1.15,<2",
    "tabulate>=0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false
