[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qpool-spqc550"
version = "0.1.0"
description = "Commitment-preserving ride-pooling research and SPQC upload validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
